syntax = "proto3";

package platform_iface;

// The doover device agent service definition.
service platformIface {

    rpc TestComms (TestCommsRequest) returns (TestCommsResponse) {}

    rpc getDI (getDIRequest) returns (getDIResponse) {}
    rpc getAI (getAIRequest) returns (getAIResponse) {}
    rpc startPulseCounter (pulseCounterRequest) returns (stream pulseCounterResponse) {}

    rpc getDO (getDORequest) returns (getDOResponse) {}
    rpc getDOCurrent (getDOCurrentRequest) returns (getDOCurrentResponse) {}
    rpc setDO (setDORequest) returns (setDOResponse) {}
    rpc scheduleDO (scheduleDORequest) returns (scheduleDOResponse) {}

    rpc getAO (getAORequest) returns (getAOResponse) {}
    rpc setAO (setAORequest) returns (setAOResponse) {}
    rpc scheduleAO (scheduleAORequest) returns (scheduleAOResponse) {}

    rpc getValue (getValueRequest) returns (getValueResponse) {}
    rpc setValue (setValueRequest) returns (setValueResponse) {}

    rpc getEvents (getEventsRequest) returns (getEventsResponse) {}
    rpc getDIEvents (getDIEventsRequest) returns (getDIEventsResponse) {}

    rpc getSystemStatus (getSystemStatusRequest) returns (getSystemStatusResponse) {}
    rpc getInputVoltage (getInputVoltageRequest) returns (getInputVoltageResponse) {}
    rpc getSystemPower (getSystemPowerRequest) returns (getSystemPowerResponse) {}
    rpc getTemperature (getTemperatureRequest) returns (getTemperatureResponse) {}
    rpc getIoTable (getIoTableRequest) returns (getIoTableResponse) {}
    rpc getIoDetails (getIoDetailsRequest) returns (getIoDetailsResponse) {}

    // The whole process image in one call: every channel of every device, in
    // the flat numbering getIoTable describes. Served from the platform
    // interface's last poll of each device, so it never waits on hardware.
    rpc getImage (getImageRequest) returns (getImageResponse) {}
    // Write any number of DOs and AOs in one call.
    rpc setImage (setImageRequest) returns (setImageResponse) {}
    // The image again whenever it changes, at most max_rate_hz times a second.
    rpc subscribeImage (subscribeImageRequest) returns (stream getImageResponse) {}
    // rpc getRtcTime (getRtcTimeRequest) returns (getRtcTimeResponse) {}
    rpc syncRtcTime (syncRtcTimeRequest) returns (syncRtcTimeResponse) {}
    // rpc getUptime (getUptimeRequest) returns (getUptimeResponse) {}
    // rpc getSystemInfo (getSystemInfoRequest) returns (getSystemInfoResponse) {}
    rpc getLocation (getLocationRequest) returns (getLocationResponse) {}
    
    rpc getShutdownImmunity (getShutdownImmunityRequest) returns (getShutdownImmunityResponse) {}
    rpc setShutdownImmunity (setShutdownImmunityRequest) returns (setShutdownImmunityResponse) {}

    rpc scheduleStartup (scheduleStartupRequest) returns (scheduleStartupResponse) {}
    rpc scheduleShutdown (scheduleShutdownRequest) returns (scheduleShutdownResponse) {}
    rpc reboot (rebootRequest) returns (rebootResponse) {}
    rpc shutdown (shutdownRequest) returns (shutdownResponse) {}

    rpc getWakeOnVoltage (getWakeOnVoltageRequest) returns (getWakeOnVoltageResponse) {}
    rpc setWakeOnVoltage (setWakeOnVoltageRequest) returns (setWakeOnVoltageResponse) {}

    rpc getWakeReason (getWakeReasonRequest) returns (getWakeReasonResponse) {}

    rpc getSleepLog (getSleepLogRequest) returns (getSleepLogResponse) {}
    rpc getSleepLogInterval (getSleepLogIntervalRequest) returns (getSleepLogIntervalResponse) {}
    rpc setSleepLogInterval (setSleepLogIntervalRequest) returns (setSleepLogIntervalResponse) {}

    rpc getDIConfig (getDIConfigRequest) returns (getDIConfigResponse) {}
    rpc setDIConfig (setDIConfigRequest) returns (setDIConfigResponse) {}

    rpc loadFirmware (loadFirmwareRequest) returns (loadFirmwareResponse) {}
    rpc loadBootloader (loadBootloaderRequest) returns (loadBootloaderResponse) {}
    rpc getFirmwareVersion (getFirmwareVersionRequest) returns (getFirmwareVersionResponse) {}

}

message ResponseHeader {
    bool success = 1;
    optional int32 response_code = 3;
    optional string message = 4;
}

message TestCommsRequest {
    string message = 1;
}

message TestCommsResponse {
    ResponseHeader response_header = 1;
    string response = 2;
}

message getDIRequest {
    repeated int32 di = 1;
    // Also read the hardware pulse totaliser and rate for each pin. Off by
    // default: on some platforms these are a separate round trip to the MCU,
    // and every existing caller wants the level only.
    optional bool include_pulses = 2;
}

// One pin's reading. A message rather than parallel `repeated` arrays because
// pulse support is per-pin, not per-device - an ELPRO Quantum counts on DIO1-4
// and not on DIO5-8 - and proto3 repeated scalars have no per-element
// presence, so a parallel array would need a sentinel to mean "cannot count".
message DIReading {
    int32 pin = 1;
    bool value = 2;
    // Absent means this pin has no hardware counter. Present and 0 means it
    // has one and nothing has been counted yet - not the same thing.
    optional uint64 pulse_count = 3;
    // Absent means the platform does not measure rate on this pin. A driver
    // with only a totaliser leaves this unset rather than differencing counts:
    // the caller knows its own sampling interval and the driver does not.
    optional float pulse_rate_hz = 4;
}

message getDIResponse {
    ResponseHeader response_header = 1;
    repeated bool di = 2;
    // Populated only when the request set include_pulses. Parallel to `di`,
    // and `di` is still filled either way so existing clients are unaffected.
    repeated DIReading readings = 3;
}

message getAIRequest {
    repeated int32 ai = 1;
}

message getAIResponse {
    ResponseHeader response_header = 1;
    repeated float ai = 2;
}

message pulseCounterRequest {
    int32 di = 1;
    string edge = 2;
}

message pulseCounterResponse {
    ResponseHeader response_header = 1;
    optional int32 di = 2;
    optional bool value = 3;
    optional float dt_secs = 4;
}

message getDORequest {
    repeated int32 do = 1;
}

message getDOResponse {
    ResponseHeader response_header = 1;
    repeated bool do = 2;
}

message getDOCurrentRequest {
    repeated int32 do = 1;
}

message getDOCurrentResponse {
    ResponseHeader response_header = 1;
    // Load current drawn by each requested output, in amps, in request order.
    repeated float current = 2;
}

message setDORequest {
    repeated int32 do = 1;
    repeated bool value = 2;
}

message setDOResponse {
    ResponseHeader response_header = 1;
    repeated bool do = 2;
}

message scheduleDORequest {
    repeated int32 do = 1;
    repeated bool value = 2;
    optional float time_secs = 3;
}

message scheduleDOResponse {
    ResponseHeader response_header = 1;
    repeated bool do = 2;
    optional float time_secs = 3;
}

message getAORequest {
    repeated int32 ao = 1;
}

message getAOResponse {
    ResponseHeader response_header = 1;
    repeated float ao = 2;
}

message getIoTableRequest {}

message getIoTableResponse {
    ResponseHeader response_header = 1;
    optional string io_table = 2;
}

// One IO channel in the flat namespace shared with getDI/setDO/etc.
message IoChannelDetail {
    int32 channel = 1;            // global flat channel number, as used by getDI/setDO/...
    int32 device_channel = 2;     // channel number on the owning device
    string io_type = 3;           // "DI" | "DO" | "AI" | "AO"
    optional string kind = 4;     // analog channels: e.g. "voltage", "current", "temperature"
    optional string units = 5;    // e.g. "V", "mA", "degC"
    bool supports_events = 6;     // DI edge events (getDIEvents)
    bool supports_pulse_counter = 7;  // per-pulse edge stream (startPulseCounter)
    bool supports_di_config = 8;  // PNP/NPN, debounce, wake-on-event (get/setDIConfig)
    // Hardware totaliser / rate register on this DI, read via getDI with
    // include_pulses. Distinct from supports_pulse_counter above: that
    // promises per-pulse *timing*, which needs an edge source, while these
    // are numbers that can simply be read. A platform can have either,
    // both, or neither — an ELPRO Quantum counts on DIO1-4 but can time
    // nothing.
    bool supports_pulse_count = 9;
    bool supports_pulse_rate = 10;
}

// The master or one slave, with the channels it contributes to the flat namespace.
message IoDeviceDetail {
    string name = 1;              // "master", or the slave's configured name
    string type = 2;              // driver type, e.g. "doovit", "moxa1242", "point_io"
    int32 index = 3;              // slave index; 0 for the master (see is_master)
    bool is_master = 4;
    bool online = 5;              // best-effort connectivity to the device
    repeated IoChannelDetail channels = 6;
}

message getIoDetailsRequest {}

message getIoDetailsResponse {
    ResponseHeader response_header = 1;
    // Master first, then slaves in index order — matching the flat channel
    // numbering produced by the platform interface's IO table accumulation.
    repeated IoDeviceDetail devices = 2;
}

message setAORequest {
    repeated int32 ao = 1;
    repeated float value = 3;
}

message setAOResponse {
    ResponseHeader response_header = 1;
    repeated float ao = 2;
}

message scheduleAORequest {
    repeated int32 ao = 1;
    repeated float value = 2;
    optional float time_secs = 3;
}

message scheduleAOResponse {
    ResponseHeader response_header = 1;
    repeated float ao = 2;
    optional float time_secs = 3;
}

message getValueRequest {
    repeated string name = 1;
}

message getValueResponse {
    ResponseHeader response_header = 1;
    repeated string value = 2;
}

message setValueRequest {
    repeated string name = 1;
    repeated string value = 2;
}

message setValueResponse {
    ResponseHeader response_header = 1;
    repeated string value = 2;
}

message getSystemStatusRequest {}

message getSystemStatusResponse {
    ResponseHeader response_header = 1;
    optional float input_voltage = 2;
    optional float temperature = 3;
    optional string rtc_time = 4;
    optional float uptime = 5;
    optional string system_info = 6;
    optional int32 scheduled_startup_secs = 7;
    optional int32 scheduled_shutdown_secs = 8;
    optional float system_current = 9;
    optional float system_power = 10;
    // Reason the CM4 was most recently woken: rpc, button, voltage,
    // di_<pin>_event, scheduled, max_off, external, reboot, or unset if never woken.
    optional string wake_reason = 11;
    // System voltage above which the CM4 is woken early. Unset / <=0 means disabled.
    optional float wake_on_voltage = 12;
}

message getShutdownImmunityRequest {}

message getShutdownImmunityResponse {
    ResponseHeader response_header = 1;
    optional int32 immunity_secs = 2;
}

message setShutdownImmunityRequest {
    int32 immunity_secs = 1;
}

message setShutdownImmunityResponse {
    ResponseHeader response_header = 1;
    optional int32 immunity_secs = 2;
}

message scheduleStartupRequest {
    optional float time_secs = 1;
}

message scheduleStartupResponse {
    ResponseHeader response_header = 1;
    optional float time_secs = 2;
}

message scheduleShutdownRequest {
    optional float time_secs = 1;
}

message scheduleShutdownResponse {
    ResponseHeader response_header = 1;
    optional float time_secs = 2;
}

message rebootRequest {}

message rebootResponse {
    ResponseHeader response_header = 1;
}

message shutdownRequest {}

message shutdownResponse {
    ResponseHeader response_header = 1;
}


message getTemperatureRequest {}

message getTemperatureResponse {
    ResponseHeader response_header = 1;
    optional float temperature = 2;
}

message getInputVoltageRequest {}

message getInputVoltageResponse {
    ResponseHeader response_header = 1;
    optional float voltage = 2;
}

message getSystemPowerRequest {}

message getSystemPowerResponse {
    ResponseHeader response_header = 1;
    optional float power_watts = 2;
}

message loadFirmwareRequest {
    string url = 1;
    string target = 2;
}

message loadFirmwareResponse {
    ResponseHeader response_header = 1;
}

message loadBootloaderRequest {
    string url = 1;
}

message loadBootloaderResponse {
    ResponseHeader response_header = 1;
}

message getFirmwareVersionRequest {}

message getFirmwareVersionResponse {
    ResponseHeader response_header = 1;
    string version = 2;
}

message getLocationRequest {}

message getLocationResponse {
    ResponseHeader response_header = 1;
    optional float latitude = 2;
    optional float longitude = 3;
    optional float altitude_m = 4;
    optional float accuracy_m = 5;
    optional float speed_mps = 6;
    optional float heading_deg = 7;
    optional int32 sat_count = 8;
    optional string timestamp = 9;
}

message syncRtcTimeRequest {}
message syncRtcTimeResponse {
    ResponseHeader response_header = 1;
}

message EventDetail {
    int32 event_id = 1;                // Event ID
    string event = 2;                   // Event type
    int32 pin = 3;                     // Pin
    string value = 4;                   // Value
    int64 time = 5;                     // Timestamp
    optional bool cm4_online = 6;
}

message getEventsRequest {
    optional int64 events_from = 1;
}

message getEventsResponse {
    ResponseHeader response_header = 1;
    repeated EventDetail events = 2;
    optional bool events_synced = 3;
}

message getDIEventsRequest {
    int32 pin = 1;
    bool rising = 2;
    bool falling = 3;
    bool include_system_events = 4;
    optional int64 events_from = 5;
}

message getDIEventsResponse {
    ResponseHeader response_header = 1;
    repeated EventDetail events = 2;
    optional bool events_synced = 3;
}

message getWakeOnVoltageRequest {}

message getWakeOnVoltageResponse {
    ResponseHeader response_header = 1;
    optional float voltage = 2;
}

message setWakeOnVoltageRequest {
    optional float voltage = 1;
}

message setWakeOnVoltageResponse {
    ResponseHeader response_header = 1;
    optional float voltage = 2;
}

message getWakeReasonRequest {}

message getWakeReasonResponse {
    ResponseHeader response_header = 1;
    // rpc, button, voltage, di_<pin>_event, scheduled, max_off, external, reboot,
    // or unset if the CM4 has never been woken.
    optional string wake_reason = 2;
}

// A single system-status snapshot captured while the CM4 was asleep.
message SleepLogEntry {
    int64 timestamp = 1;                 // epoch milliseconds when the snapshot was captured
    optional float input_voltage = 2;    // system voltage ("v")
    optional float system_current = 3;   // system current in amps ("i")
    repeated bool di = 4;                // digital input states (pins 0-3)
    repeated bool do = 5;                // digital output states (pins 0-5)
    repeated float ai = 6;               // analog input readings (pins 0-5)
    repeated float ao = 7;               // analog output values (pins 0-1)
    optional float system_power = 8;     // system power in watts ("p")
}

message getSleepLogRequest {
    // epoch milliseconds; only snapshots at or after this time are returned.
    // 0 / unset returns all stored snapshots (capped at 100).
    optional int64 since = 1;
}

message getSleepLogResponse {
    ResponseHeader response_header = 1;
    repeated SleepLogEntry entries = 2;  // ascending by timestamp (oldest first)
}

message getSleepLogIntervalRequest {}

message getSleepLogIntervalResponse {
    ResponseHeader response_header = 1;
    optional int32 interval_secs = 2;    // 0 means sleep logging is disabled
}

message setSleepLogIntervalRequest {
    // seconds between sleep-log snapshots; 0 disables logging.
    optional int32 interval_secs = 1;
}

message setSleepLogIntervalResponse {
    ResponseHeader response_header = 1;
    optional int32 interval_secs = 2;
}

message getDIConfigRequest {
    int32 pin = 1;
}

message DIConfig {
    int32 pin = 1;
    bool pnp_mode = 2;
    string irq_edge = 3;        // "rising", "falling" or "both"
    int32 debounce_ms = 4;
    bool wake_on_event = 5;     // wake the CM4 when an event fires on this pin
}

message getDIConfigResponse {
    ResponseHeader response_header = 1;
    optional DIConfig config = 2;
}

// Patch request: pin selects the input; any other field that is set is applied,
// fields left unset keep their existing stored value.
message setDIConfigRequest {
    int32 pin = 1;
    optional bool pnp_mode = 2;
    optional string irq_edge = 3;
    optional int32 debounce_ms = 4;
    optional bool wake_on_event = 5;
}

message setDIConfigResponse {
    ResponseHeader response_header = 1;
    optional DIConfig config = 2;
}

message getImageRequest {}

// Why a channel's value is not plain good. Values after GOOD may be added;
// treat any value a client does not know as "not good".
enum ChannelQuality {
    CHANNEL_QUALITY_GOOD = 0;
    // The device's data is older than its staleness limit.
    CHANNEL_QUALITY_STALE = 1;
    // The device has not answered yet, or has dropped off.
    CHANNEL_QUALITY_OFFLINE = 2;
    // The device answered but gave no value for this channel.
    CHANNEL_QUALITY_NO_VALUE = 3;
    // The hardware reports a fault on this channel.
    CHANNEL_QUALITY_FAULT = 4;
    // An analog input below its valid range (e.g. NAMUR NE43, < 3.6 mA: wire break).
    CHANNEL_QUALITY_UNDER_RANGE = 5;
    // An analog input above its valid range (e.g. NAMUR NE43, > 21 mA).
    CHANNEL_QUALITY_OVER_RANGE = 6;
    // An input or output tripped on overcurrent.
    CHANNEL_QUALITY_OVERCURRENT = 7;
}

message ChannelStatus {
    ChannelQuality quality = 1;
    optional string detail = 2;
}

// One device's part of the image: the master, then each slave.
message DeviceImageStatus {
    // -1 for the master, else the slave's configured index.
    int32 index = 1;
    string name = 2;
    // True while the device's data is fresh enough to serve.
    bool online = 3;
    // Age of the device's latest successful poll when this response was
    // built; unset before the first poll.
    optional uint64 age_ms = 4;
    optional string last_error = 5;
    // Wall-clock time of that poll, Unix milliseconds. Can be wrong on a
    // device whose clock has not synced; age_ms is the reliable measure.
    optional uint64 timestamp_ms = 6;
}

message getImageResponse {
    ResponseHeader response_header = 1;
    // Indexed by flat channel number (the getIoTable numbering). Indices never
    // shift: a channel without a good value still has an entry here (false /
    // 0 when there is no value at all), and is listed in the matching
    // *_status map.
    repeated bool di = 2;
    repeated bool do = 3;
    repeated double ai = 4;
    repeated double ao = 5;
    // Sparse: only channels whose quality is not GOOD appear.
    map<int32, ChannelStatus> di_status = 6;
    map<int32, ChannelStatus> do_status = 7;
    map<int32, ChannelStatus> ai_status = 8;
    map<int32, ChannelStatus> ao_status = 9;
    // Pulse totals and rates, for the DI channels that have them.
    map<int32, uint64> di_count = 10;
    map<int32, double> di_rate_hz = 11;
    repeated DeviceImageStatus devices = 12;
    // Increases when any value or channel status changes, and only then.
    uint64 sequence = 13;
}

// Sparse: only the listed channels are written. Same parallel-list shape as
// setDO / setAO.
message setImageRequest {
    repeated int32 do = 1;
    repeated bool do_value = 2;
    repeated int32 ao = 3;
    repeated double ao_value = 4;
}

message setImageResponse {
    ResponseHeader response_header = 1;
    // Channels whose write failed. The others were written.
    repeated int32 failed_do = 2;
    repeated int32 failed_ao = 3;
}

message subscribeImageRequest {
    // Upper bound on messages per second; unset or 0 sends every change.
    optional float max_rate_hz = 1;
}
